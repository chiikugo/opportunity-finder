# ==========================================================================
# refresh.yml — runs the daily collector + verifier on GitHub's servers
# (free for public repos) and saves the results to data/fresh.json.
# GitHub Pages then republishes the site automatically.
#
# 👉 Change the time:  edit the cron line (it's in UTC; 13:17 UTC ≈ 8–9am ET).
#    Run it right now: GitHub → Actions → "Refresh new finds" → Run workflow.
# Note: GitHub pauses scheduled jobs in repos with no activity for 60 days.
#       The daily commits below count as activity, so it keeps itself awake.
# ==========================================================================
name: Refresh new finds

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # the first Reddit cross-check pass is slow; later runs use the cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect, verify and scam-check listings
        run: node scripts/scrape.mjs
        env:
          # Optional: your own Reddit app keys make the Reddit scam check fast
          # and reliable. Add them under Settings → Secrets → Actions.
          # Without them the free (slower) Reddit archive is used instead.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - name: Save if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fresh.json data/reputation.json
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily refresh of new finds"
            git push
          fi
